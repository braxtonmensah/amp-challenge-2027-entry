[project]
name = "amp-challenge-entry"
version = "0.1.0"
description = "Antimicrobial peptide library generation for the AMP Challenge 2027 (NeurIPS 2026 Competition Track)"
readme = "README.md"
authors = [
    { name = "Braxton Mensah", email = "bsmensah@iu.edu" }
]
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6", "levenshtein>=0.27.3",
    "biopython>=1.83",
]

[project.scripts]
generate = "amp.generate:main"
generate_broad_spectrum = "amp.generate:main"
generate_gram_positive = "amp.generate:main"
generate_gram_negative = "amp.generate:main"
generate_mdr = "amp.generate:main"
generate_low_hemolysis = "amp.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp"]
